[package]
name = "kafka-topics"
version = "1.0.2"
edition = "2024"
default-run = "kafka-topics"
description = "The Kafka topics operator"
homepage = "https://github.com/wdonne/kafka-topics"
repository = "https://github.com/wdonne/kafka-topics"
license = "BSD-2-Clause"
readme = "README.md"
keywords = ["kubernetes", "operator", "kafka", "topics"]
exclude = ["*.iml"]

[[bin]]
doc = false
name = "crdgen"
path = "src/crdgen.rs"

[dependencies]
kube = { version = "4.2.0", features = ["runtime", "derive", "client"] }
k8s-openapi = { version = "0.28.0", features = ["v1_36"] }
schemars = "1.2.2"
serde = "1.0.229"
serde_json = "1.0.151"
serde_yaml = "0.9.34+deprecated"
kube-operator-util = "1.2.2"
tokio = { version = "1.53.1", features = ["full"] }
log = "0.4.34"
thiserror = "2.0.20"
anyhow = "1.0.104"
futures = "0.3.34"
rustls = { version = "0.23.45", features = ["ring"] }
env_logger = "0.11.11"
config = "0.15.26"
rdkafka = { version = "0.39.0", features = ["cmake-build", "ssl-vendored", "static-linking",
    "curl-static"] }
