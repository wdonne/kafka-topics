[package]
name = "kafka-topics"
version = "1.0.0"
edition = "2024"
default-run = "kafka-topics"
description = "The Kafka topics operator"
homepage = "https://github.com/wdonne/kafka-topics"
repository = "https://github.com/wdonne/kafka-topics"
license = "BSD-2-Clause"
readme = "README.md"
keywords = ["kubernetes", "operator", "kafka", "topics"]
exclude = ["*.iml"]

[[bin]]
doc = false
name = "crdgen"
path = "src/crdgen.rs"

[dependencies]
kube = { version = "3.1.0", features = ["runtime", "derive", "client"] }
k8s-openapi = { version = "0.27.1", features = ["v1_31"] }
schemars = "1.2.1"
serde = "1.0.228"
serde_json = "1.0.149"
serde_yaml = "0.9.34+deprecated"
kube-operator-util = "1.2.0"
tokio = { version = "1.52.3", features = ["full"] }
log = "0.4.29"
thiserror = "2.0.18"
anyhow = "1.0.102"
futures = "0.3.32"
rustls = { version = "0.23.40", features = ["ring"] }
env_logger = "0.11.10"
config = "0.15.22"
rdkafka = { version = "0.39.0", features = ["cmake-build", "ssl-vendored", "static-linking",
    "curl-static"] }
